<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>포켓몬 상세 조회</title></head>
<body>
    <h1>포켓몬 상세 정보</h1>
    <p><strong>ID:</strong> <span th:text="${pokemon.id}"></span></p>
    <p><strong>이름:</strong> <span th:text="${pokemon.name}"></span></p>
    <p><strong>타입:</strong> <span th:text="${pokemon.type}"></span></p>
    <p><strong>레벨:</strong> <span th:text="${pokemon.level}"></span></p>
</body>
</html>
