<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>트레이너 상세 조회</title></head>
<body>
    <h1>트레이너 상세 정보</h1>
    <p><strong>ID:</strong> <span th:text="${trainer.id}"></span></p>
    <p><strong>이메일:</strong> <span th:text="${trainer.email}"></span></p>
    <p><strong>이름:</strong> <span th:text="${trainer.name}"></span></p>
    <p><strong>출신 지역:</strong> <span th:text="${trainer.region}"></span></p>
</body>
</html>
