<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>포켓몬 전체 목록</title></head>
<body>
    <h1>포켓몬 목록 (<span th:text="${type}"></span>)</h1>
    <ul>
        <li th:each="pokemon : ${pokemons}">
            <span th:text="${pokemon.id}"></span> -
            <span th:text="${pokemon.name}"></span> -
            <span th:text="${pokemon.type}"></span> -
            Lv.<span th:text="${pokemon.level}"></span>
        </li>
    </ul>
</body>
</html>
